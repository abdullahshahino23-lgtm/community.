<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123b35">
  <meta name="description" content="منصة الجالية المصرية في نجران: خدمات ومجتمع وسكن ووظائف، معاك في الغربة.">
  <title>الجالية المصرية بنجران — معاك في الغربة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg:#f5f6f2; --surface:#fff; --surface2:#f0f3ee; --ink:#17332e; --muted:#6f7d77;
      --green:#123b35; --green2:#1c5147; --red:#bd4b44; --gold:#c9a65e; --line:#e4e9e2;
      --shadow:0 14px 40px rgba(21,48,39,.09); --radius:20px; --safe-b:env(safe-area-inset-bottom,0px);
    }
    :root[data-theme="dark"] {
      color-scheme:dark; --bg:#111916; --surface:#19231f; --surface2:#202c27; --ink:#edf2ed;
      --muted:#a4b2aa; --green:#a9d0bc; --green2:#8fbea7; --red:#ef958c; --gold:#e0bf77;
      --line:#303e37; --shadow:0 14px 42px rgba(0,0,0,.24);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;min-height:100vh}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    a{color:var(--green);text-decoration:none}
    .shell{max-width:1180px;margin:auto;padding:0 20px 110px}
    .topbar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-mark{width:47px;height:47px;border-radius:15px;background:var(--green);display:grid;place-items:center;position:relative;overflow:hidden;color:#fff;flex:none}
    .brand-mark:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--red)}
    .brand-mark:after{content:"";position:absolute;inset:auto 0 0;height:5px;background:#d8c9a2}
    .brand-mark b{font-size:22px;color:#e4c87e;position:relative}
    .brand-name{font-size:15px;line-height:1.35;font-weight:800;white-space:normal}
    .brand-sub{font-size:11px;color:var(--muted);font-weight:600}
    .top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn,.quiet-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-width:46px;height:46px;display:grid;place-items:center}
    .quiet-btn{display:flex;padding:0 13px;gap:8px;font-size:13px;font-weight:700}
    .icon-btn svg,.quiet-btn svg{width:20px;height:20px}
    .connection{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:7px 10px;border-radius:99px;background:var(--surface2)}
    .dot{width:8px;height:8px;border-radius:50%;background:#c69342}
    .dot.on{background:#3c9b70}.dot.off{background:#bb554d}
    .hero{position:relative;overflow:hidden;border-radius:28px;background:var(--green);color:#fff;padding:30px 32px;margin:8px 0 23px;box-shadow:var(--shadow);min-height:235px}
    .hero:before{content:"";position:absolute;width:260px;height:260px;left:-65px;top:-112px;border:1px solid rgba(229,203,139,.25);border-radius:50%;box-shadow:0 0 0 25px rgba(255,255,255,.025),0 0 0 52px rgba(255,255,255,.022)}
    .hero:after{content:"";position:absolute;inset:auto 0 0;height:5px;background:linear-gradient(90deg,#bd4b44 0 32%,#fff 32% 66%,#bd4b44 66% 100%);opacity:.8}
    .hero-content{position:relative;z-index:1;max-width:650px}
    .eyebrow{color:#e4c77d;font-weight:800;font-size:12px;letter-spacing:.02em}
    .hero h1{font-size:clamp(27px,5vw,42px);line-height:1.26;margin:8px 0 9px;font-weight:800}
    .hero p{color:#d9e6de;margin:0;line-height:1.8;font-size:14px;max-width:600px}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}
    .btn{border:0;border-radius:14px;padding:11px 17px;min-height:46px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:var(--gold);color:#1e332b}
    .btn-light{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.23)}
    .btn-outline{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
    .btn-danger{background:#a83d39;color:white}
    .btn-small{min-height:38px;padding:7px 12px;border-radius:11px;font-size:12px}
    .setup-banner{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 17px;border-radius:17px;background:#fff7e6;color:#57451e;border:1px solid #ead5a7;margin:0 0 24px}
    :root[data-theme="dark"] .setup-banner{background:#362f1e;color:#ebd69f;border-color:#675a35}
    .setup-banner strong{display:block;font-size:14px}.setup-banner span{font-size:12px;line-height:1.6}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 13px}
    .section-head h2{font-size:20px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:3px 0 0}
    .text-link{color:var(--green);font-weight:800;background:none;border:0;padding:8px}
    .category-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
    .category{border:1px solid var(--line);background:var(--surface);border-radius:17px;min-height:105px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-align:center;transition:.18s}
    .category:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:var(--shadow)}
    .cat-icon{width:38px;height:38px;border-radius:13px;background:var(--surface2);color:var(--green);display:grid;place-items:center}
    .cat-icon svg{width:21px;height:21px}.category span:last-child{font-size:12px;font-weight:700;line-height:1.45}
    .feature-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
    .feature{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:flex-start}
    .feature-mark{width:39px;height:39px;border-radius:13px;background:var(--surface2);display:grid;place-items:center;color:var(--green);flex:none}
    .feature-mark svg{width:21px;height:21px}.feature strong{font-size:13px}.feature p{font-size:11px;color:var(--muted);margin:4px 0 0;line-height:1.65}
    .searchbar{display:flex;gap:9px;margin:16px 0}.searchbox{flex:1;position:relative}.searchbox input{width:100%;padding:12px 43px 12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);min-height:48px}
    .searchbox svg{position:absolute;right:14px;top:14px;width:20px;height:20px;color:var(--muted)}
    .filter-select{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0 12px;min-height:48px;max-width:170px}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .listing-card{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:16px;min-width:0}
    .card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
    .badge{display:inline-flex;border-radius:99px;background:var(--surface2);color:var(--green);padding:5px 9px;font-size:11px;font-weight:800}
    .heart{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);color:var(--muted);background:var(--surface);display:grid;place-items:center}
    .heart.active{color:#bd4b44;border-color:#e9c4bf}.heart svg{width:19px}
    .listing-card h3{font-size:16px;line-height:1.55;margin:10px 0 5px}
    .listing-card p{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 11px}
    .meta{display:flex;flex-wrap:wrap;gap:11px;color:var(--muted);font-size:11px;margin:10px 0}
    .card-actions{display:flex;gap:8px;margin-top:13px}.card-actions .btn{flex:1}
    .empty{padding:30px 18px;border:1px dashed var(--line);background:var(--surface);border-radius:18px;text-align:center;color:var(--muted)}
    .empty b{color:var(--ink);display:block;margin-bottom:5px}.empty p{font-size:12px;margin:0;line-height:1.7}
    .page-title{font-size:25px;margin:16px 0 4px}.page-lead{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.7}
    .nav-bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--safe-b));display:flex;justify-content:center;backdrop-filter:blur(14px)}
    .nav-inner{width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
    .nav-item{background:none;border:0;color:var(--muted);min-height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;font-size:10px;font-weight:700}
    .nav-item svg{width:21px;height:21px}.nav-item.active{color:var(--green);background:var(--surface2)}
    .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(7,19,15,.58);display:flex;justify-content:center;align-items:flex-end;padding:12px}
    .modal{width:min(650px,100%);max-height:min(90dvh,900px);overflow:auto;background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow);animation:rise .2s ease}
    .modal.wide{width:min(900px,100%)}.modal h2{margin:0 0 7px;font-size:21px}.modal-sub{margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.75}
    .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .close-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);height:40px;width:40px;border-radius:12px;font-size:22px}
    .field{margin:0 0 13px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 6px}
    .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;min-height:47px}
    .field textarea{min-height:105px;resize:vertical}.field small{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.55}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.modal-actions .btn{flex:1}
    .notice{padding:12px;border-radius:12px;background:var(--surface2);font-size:12px;line-height:1.7;color:var(--muted);margin:12px 0}
    .notice.warn{background:#fff5de;color:#695521}.notice.error{background:#fff0ed;color:#813c35}
    :root[data-theme="dark"] .notice.warn{background:#3c3422;color:#e5d297}:root[data-theme="dark"] .notice.error{background:#402823;color:#ffc1b5}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .tab-pill{border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);padding:8px 13px;font-weight:700}
    .tab-pill.selected{background:var(--green);color:#fff;border-color:var(--green)}
    .item-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
    .item-row:last-child{border:0}.item-row strong{font-size:13px}.item-row small{color:var(--muted);display:block;font-size:11px}
    .avatar{width:44px;height:44px;border-radius:15px;background:var(--surface2);display:grid;place-items:center;font-weight:800;color:var(--green);flex:none}
    .row-main{display:flex;align-items:center;gap:11px;min-width:0}.row-main>div:last-child{min-width:0}
    .chat-window{height:50vh;min-height:280px;overflow:auto;background:var(--bg);border-radius:15px;padding:13px;margin:12px 0}
    .bubble{max-width:82%;padding:10px 12px;border-radius:15px;background:var(--surface);margin:8px 0;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
    .bubble.mine{background:var(--green);color:#fff;margin-right:auto}
    .bubble time{display:block;font-size:10px;opacity:.7;margin-top:3px}
    .chat-form{display:flex;gap:8px}.chat-form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:13px;padding:11px}
    .switch-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
    .switch-line button{min-width:45px}.legal{font-size:13px;line-height:1.9;color:var(--muted)}
    .codebox{white-space:pre;overflow:auto;max-height:310px;background:#13201b;color:#e0e7df;padding:14px;border-radius:13px;font:11px/1.6 ui-monospace,monospace;direction:ltr;text-align:left}
    .toast{position:fixed;z-index:90;bottom:calc(82px + var(--safe-b));left:50%;transform:translateX(-50%);background:#172a23;color:#fff;border-radius:14px;padding:11px 16px;font-size:12px;max-width:90vw;box-shadow:var(--shadow);text-align:center}
    .hidden{display:none!important}
    .admin-shell{border:1px solid var(--line);border-radius:18px;padding:15px;background:var(--bg)}
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
    .stat{background:var(--surface);padding:13px;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
    .image-preview{max-width:100%;max-height:190px;border-radius:12px;margin-top:9px}
    footer{border-top:1px solid var(--line);margin-top:35px;padding:18px 0 10px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    @keyframes rise{from{opacity:.7;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(min-width:760px){
      .shell{padding:0 28px 48px}.hero{padding:38px 42px}.nav-bottom{position:static;background:none;border:0;padding:15px 0 5px;backdrop-filter:none}.nav-inner{max-width:610px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:17px}
      .modal-backdrop{align-items:center}.modal{border-radius:22px}
    }
    @media(max-width:700px){.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.feature-row{grid-template-columns:1fr}.hero{padding:25px 22px}.connection .status-text{display:none}}
    @media(max-width:430px){.shell{padding-left:14px;padding-right:14px}.brand-name{font-size:13px}.quiet-btn .word{display:none}.category-grid{gap:8px}.category{min-height:94px}.cards{grid-template-columns:1fr}.filter-select{max-width:120px}.setup-banner{align-items:flex-start;flex-direction:column}.setup-banner .btn{width:100%}.form-row{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><b>ن</b></div>
        <div><div class="brand-name" id="brandName"></div><div class="brand-sub" id="brandSub"></div></div>
      </div>
      <div class="top-actions">
        <div class="connection" title="حالة اتصال Firebase"><i class="dot" id="connDot"></i><span class="status-text" id="connText"></span></div>
        <button class="icon-btn" data-act="theme" aria-label="تغيير المظهر" title="الوضع الليلي/النهاري"><span id="themeIcon"></span></button>
        <button class="quiet-btn" data-act="language" aria-label="تغيير اللغة"><span id="langText"></span></button>
        <button class="quiet-btn" data-act="account"><span id="accountIcon"></span><span class="word" id="accountText"></span></button>
      </div>
    </header>
    <main id="view" aria-live="polite"></main>
    <footer>
      <span id="footerLine"></span>
      <span><button class="text-link" data-act="privacy"></button><button class="text-link" data-act="terms"></button><button class="text-link" data-act="settings"></button></span>
    </footer>
    <nav class="nav-bottom" aria-label="التنقل الرئيسي"><div class="nav-inner" id="nav"></div></nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

<script type="module">
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SVG={
  home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  group:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/>',
  moon:'<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',

  help:'<circle cx="12" cy="12" r="9"/><path d="M12 16v.01M9.5 9a2.5 2.5 0 1 1 4.4 1.6c-1 1-1.9 1.2-1.9 2.4"/>',
  pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',

  star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>',
  bag:'<path d="M5 8h14l-1 13H6L5 8zM9 8a3 3 0 0 1 6 0"/>',
  news:'<path d="M4 4h16v17H4zM8 8h8M8 12h8M8 16h5"/>'
};

const FIRESTORE_RULES=`rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {
  function signed() { return request.auth != null; }
  function admin() { return signed() && (request.auth.token.admin == true || request.auth.token.superAdmin == true); }
  function owner(uid) { return signed() && request.auth.uid == uid; }
  match /users/{uid} {
   allow get: if owner(uid) || admin();
   allow list: if admin();
   allow create: if owner(uid) && request.resource.data.keys().hasOnly(['displayName','phoneNumber','createdAt','updatedAt']) && request.resource.data.displayName is string;
   allow update: if owner(uid) && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['displayName','phoneNumber','updatedAt']);
   allow delete: if false;
   match /favorites/{id} { allow read, write: if owner(uid); }
   match /devices/{id} { allow read, write: if owner(uid); }
  }
  match /listings/{id} {
   allow read: if resource.data.status == 'approved' || (signed() && resource.data.ownerId == request.auth.uid) || admin();
   allow create: if signed() && request.resource.data.ownerId == request.auth.uid && request.resource.data.status == 'pending' && request.resource.data.title is string && request.resource.data.title.size() <= 120;
   allow update, delete: if admin() || (signed() && resource.data.ownerId == request.auth.uid && resource.data.status == 'pending' && request.resource.data.status == 'pending');
   match /reviews/{uid} {
    allow read: if true;
    allow create: if owner(uid) && request.resource.data.userId == uid && request.resource.data.stars is int && request.resource.data.stars >= 1 && request.resource.data.stars <= 5;
    allow update, delete: if false;
   }
  }
  match /posts/{id} {
   allow read: if resource.data.status == 'approved' || (signed() && resource.data.ownerId == request.auth.uid) || admin();
   allow create: if signed() && request.resource.data.ownerId == request.auth.uid && request.resource.data.status == 'pending' && request.resource.data.description is string;
   allow update, delete: if admin() || (signed() && resource.data.ownerId == request.auth.uid && resource.data.status == 'pending');
  }
  match /reports/{id} {
   allow create: if signed() && request.resource.data.reporterId == request.auth.uid && request.resource.data.reason is string;
   allow read: if admin();
   allow update, delete: if false;
  }
  match /chats/{chatId} {
   allow read: if signed() && request.auth.uid in resource.data.members;
   allow create: if signed() && request.auth.uid in request.resource.data.members && request.resource.data.members.size() == 2;
   allow update: if signed() && request.auth.uid in resource.data.members && request.resource.data.members == resource.data.members && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['lastMessage','lastAt']);
   allow delete: if false;
   match /messages/{messageId} {
    allow read: if signed() && request.auth.uid in get(/databases/$(database)/documents/chats/$(chatId)).data.members;
    allow create: if signed() && request.resource.data.senderId == request.auth.uid && request.auth.uid in get(/databases/$(database)/documents/chats/$(chatId)).data.members && request.resource.data.text is string && request.resource.data.text.size() <= 3000;
    allow update, delete: if false;
   }
  }
  match /adminAudit/{id} { allow read: if admin(); allow write: if false; }
  match /{document=**} { allow read, write: if false; }
 }
}`;

function requireAdmin(req, superOnly=false){
 if(!req.auth || !(superOnly ? req.auth.token.superAdmin===true :
    (req.auth.token.admin===true || req.auth.token.superAdmin===true)))
   throw new HttpsError('permission-denied','Administrator claim required');

exports.adminModerate=onCall(async req=>{
 requireAdmin(req);
 const {collection,id,status}=req.data||{};
 if(!['listings','posts'].includes(collection) || typeof id!=='string' ||
    !['approved','rejected'].includes(status)) throw new HttpsError('invalid-argument','Invalid moderation request');
 const ref=db.collection(collection).doc(id), snap=await ref.get();
 if(!snap.exists) throw new HttpsError('not-found','Content not found');
 await db.runTransaction(async tx=>{
  const fresh=await tx.get(ref);
  tx.update(ref,{status,moderatedAt:FieldValue.serverTimestamp(),moderatedBy:req.auth.uid});
  const log=db.collection('adminAudit').doc();
  tx.set(log,{actor:req.auth.uid,action:'moderate',collection,id,status,
    previousStatus:fresh.get('status')||null,createdAt:FieldValue.serverTimestamp()});
 });
 return {ok:true};
});
exports.adminSetModerator=onCall(async req=>{

 if(typeof uid!=='string'||typeof enabled!=='boolean') throw new HttpsError('invalid-argument','Invalid request');

 if(claims.superAdmin===true) throw new HttpsError('failed-precondition','Use a separate reviewed bootstrap process for Super Admin');
 if(enabled) claims.admin=true; else delete claims.admin;

});

 const {storeM}=cachedFns||{};if(!id)return;
 if(savedIds.has(id)){savedIds.delete(id);showToast(t('unsaved'))}else{savedIds.add(id);showToast(t('saved'))}
 localStorage.setItem('najran_favs',JSON.stringify([...savedIds]));render();
 if(user&&db&&storeM){try{const ref=storeM.doc(db,'users',user.uid,'favorites',id);if(savedIds.has(id))await storeM.setDoc(ref,{listingId:id,createdAt:storeM.serverTimestamp()});else await storeM.deleteDoc(ref)}catch(e){console.warn('favorite sync',e)}}
}
function findContent(id){return listings.find(x=>x.id===id)||posts.find(x=>x.id===id)}
function showDetail(id){
 const x=findContent(id);if(!x)return;
 currentDetail=x;
 openModal(`${modalHeader(x.title||t('show'),catName(x.category))}
 ${x.imageUrl?`<img class="image-preview" src="${esc(x.imageUrl)}" alt="${esc(x.title||'')}" onerror="this.alt='${esc(t('emptyImage'))}';this.hidden=true">`:''}
 <p class="legal">${esc(x.description||'')}</p>
 <div class="meta"><span>${icon('pin')} ${esc(x.location||t('city'))}</span>${x.price?`<span>${esc(x.price)}</span>`:''}<span>${esc(timeText(x.createdAt))}</span></div>
 ${x.contactPhone?`<div class="notice">${esc(t('contactPhone'))}: <a href="tel:${esc(x.contactPhone)}">${esc(x.contactPhone)}</a></div>`:''}
 <div class="modal-actions"><button class="btn btn-outline" data-act="favorite" data-id="${esc(id)}">${esc(savedIds.has(id)?t('removeFavorite'):t('favorite'))}</button>
 ${x.location?`<a class="btn btn-outline" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.location+' Najran')}">${esc(t('map'))}</a>`:''}
 ${x.ownerId!==user?.uid?`<button class="btn btn-primary" data-act="chat" data-id="${esc(id)}">${esc(t('contact'))}</button>`:''}</div>
 <div class="modal-actions"><button class="btn btn-outline" data-act="report" data-id="${esc(id)}" data-type="${x.category==='community'?'post':'listing'}">${esc(t('report'))}</button>${x.category!=='community'?`<button class="btn btn-outline" data-act="review" data-id="${esc(id)}">${esc(t('review'))}</button>`:''}</div>
 <div id="reviewsArea"></div>`);
}
async function openChatWith(targetId,targetName=''){
 if(!user){showToast(t('loginNeeded'));showAuthModal();return}
 if(!db||!cachedFns){showSettings();return}
 if(!targetId||targetId===user.uid){showToast(t('chatError'));return}
 const {storeM}=cachedFns;
 const members=[user.uid,targetId].sort();const chatId=members.join('__');const ref=storeM.doc(db,'chats',chatId);
 try{
  const snap=await storeM.getDoc(ref);
  const names={...(snap.exists()?snap.data().memberNames||{}:{})};
  names[user.uid]=userProfile?.displayName||user.phoneNumber||'';
  if(targetName)names[targetId]=targetName;
  if(!snap.exists())await storeM.setDoc(ref,{members,memberNames:names,createdAt:storeM.serverTimestamp(),lastMessage:'',lastAt:storeM.serverTimestamp()});
  else await storeM.updateDoc(ref,{memberNames:names});
  currentChat={id:chatId,otherId:targetId,name:targetName||names[targetId]||targetId.slice(0,10)};
  showChatModal();
 }catch(e){console.error(e);showToast(`${t('chatError')}: ${e.message||''}`)}
}
function showChatModal(){
 if(!currentChat)return;
 openModal(`${modalHeader(currentChat.name,t('messagesTitle'))}<div class="chat-window" id="chatMessages"></div><form id="chatForm" class="chat-form"><input name="message" maxlength="3000" placeholder="${esc(t('enterMessage'))}" required><button class="btn btn-primary" type="submit">${esc(t('send'))}</button></form>`);
 const {storeM}=cachedFns;const q=storeM.query(storeM.collection(db,'chats',currentChat.id,'messages'),storeM.orderBy('createdAt','asc'),storeM.limit(100));
 chatUnsub=storeM.onSnapshot(q,s=>{
  const box=$('#chatMessages');if(!box)return;
  box.innerHTML=s.docs.map(d=>{const m=d.data();return `<div class="bubble ${m.senderId===user.uid?'mine':''}">${esc(m.text)}<time>${esc(timeText(m.createdAt))}</time></div>`}).join('');
  box.scrollTop=box.scrollHeight;
 },e=>{console.warn(e);const box=$('#chatMessages');if(box)box.innerHTML=`<div class="notice error">${esc(t('noPermission'))}</div>`});
}
async function sendMessage(form){
 if(!currentChat||!user)return;
 const fd=new FormData(form),text=String(fd.get('message')||'').trim();if(!text)return;
 const {storeM}=cachedFns,chatRef=storeM.doc(db,'chats',currentChat.id);
 const msg={senderId:user.uid,text,createdAt:storeM.serverTimestamp()};
 await storeM.addDoc(storeM.collection(db,'chats',currentChat.id,'messages'),msg);
 await storeM.updateDoc(chatRef,{lastMessage:text.slice(0,100),lastAt:storeM.serverTimestamp()});
 form.reset();
}
async function startChatFor(id){
 const x=findContent(id);if(!x)return;
 if(!x.ownerId){showToast(t('chatError'));return}
 await openChatWith(x.ownerId,x.ownerName||'');
}
function showReport(id,type){
 if(!user){showToast(t('loginNeeded'));showAuthModal();return}
 openModal(`${modalHeader(t('report'),t('reportReason'))}<form id="reportForm" data-id="${esc(id)}" data-type="${esc(type||'listing')}"><div class="field"><label for="reason">${esc(t('reportReason'))}</label><textarea id="reason" name="reason" maxlength="1500" required></textarea></div><button class="btn btn-primary" type="submit">${esc(t('send'))}</button></form>`);
}
function showReview(id){
 if(!user){showToast(t('loginNeeded'));showAuthModal();return}
 openModal(`${modalHeader(t('review'),t('reviewText'))}<form id="reviewForm" data-id="${esc(id)}">
 <div class="field"><label for="stars">${esc(t('stars'))}</label><select id="stars" name="stars"><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option></select></div>
 <div class="field"><label for="reviewText">${esc(t('reviewText'))}</label><textarea id="reviewText" name="text" maxlength="1500" required></textarea></div><button class="btn btn-primary" type="submit">${esc(t('send'))}</button></form>`);
}
async function saveReport(form){
 const id=form.dataset.id;const reason=String(new FormData(form).get('reason')||'').trim();if(!reason)return;
 const {storeM}=cachedFns;
 await storeM.addDoc(storeM.collection(db,'reports'),{targetId:id,targetType:form.dataset.type,reason,reporterId:user.uid,status:'open',createdAt:storeM.serverTimestamp()});
 closeModal();showToast(t('reportSent'));
}
async function saveReview(form){
 const id=form.dataset.id,fd=new FormData(form),{storeM}=cachedFns;
 await storeM.setDoc(storeM.doc(db,'listings',id,'reviews',user.uid),{userId:user.uid,stars:Number(fd.get('stars')),text:String(fd.get('text')||'').trim(),createdAt:storeM.serverTimestamp()});
 closeModal();showToast(t('reviewSent'));
}
async function saveProfile(form){
 const name=String(new FormData(form).get('displayName')||'').trim();if(name.length<2)throw new Error('اكتب اسماً من حرفين على الأقل.');
 const {storeM}=cachedFns;
 await storeM.setDoc(storeM.doc(db,'users',user.uid),{displayName:name,phoneNumber:user.phoneNumber||'',updatedAt:storeM.serverTimestamp(),...(userProfile?.displayName?{}:{createdAt:storeM.serverTimestamp()})},{merge:true});
 userProfile={...(userProfile||{}),displayName:name};closeModal();render();showToast(t('save'));
}
async function initVerifier(targetAuth,containerId){
 const {authM}=cachedFns;
 if(!authM)return null;
 if(verifier){try{verifier.clear()}catch{}verifier=null}
 verifier=new authM.RecaptchaVerifier(targetAuth,containerId,{size:'invisible',callback:()=>{}});
 await verifier.render();return verifier;
}
async function sendOtp(phone,admin=false){
 if(!/^\+[1-9]\d{7,14}$/.test(phone))throw new Error(t('phoneHelp'));
 const target=admin?adminAuth:auth;
 const vr=await initVerifier(target,admin?'admin-recaptcha':'recaptcha-container');
 const {authM}=cachedFns;confirmation=await authM.signInWithPhoneNumber(target,phone,vr);
 if(admin){$('#adminOtpForm')?.classList.remove('hidden');$('#adminPhoneForm')?.classList.add('hidden');showToast(t('otp'))}
 else{$('#otpForm')?.classList.remove('hidden');$('#phoneForm')?.classList.add('hidden');showToast(t('otp'))}
}
async function verifyOtp(code,admin=false){
 if(!confirmation)throw new Error(t('error'));
 const result=await confirmation.confirm(code);confirmation=null;
 if(!admin){user=result.user;closeModal();render();return}
 await inspectAdmin(result.user);
}
async function inspectAdmin(u){
 adminUser=u;
 try{
  const {authM}=cachedFns;const token=await authM.getIdTokenResult(u,true);
  if(token.claims.admin!==true&&token.claims.superAdmin!==true){await authM.signOut(adminAuth);adminUser=null;$('#adminArea').innerHTML=`<div class="notice error">${esc(t('adminDenied'))}</div>`;return}
  $('#adminArea').innerHTML=adminDashboardShell();await loadAdminData();
 }catch(e){console.error(e);$('#adminArea').innerHTML=`<div class="notice error">${esc(t('error'))}: ${esc(e.message||'')}</div>`}
}
function adminDashboardShell(){
 return `<div class="admin-shell"><div class="row-main"><span class="avatar">${icon('shield')}</span><div><strong>${esc(t('adminDashboard'))}</strong><small>${esc(adminUser?.phoneNumber||'')} · ${adminUser?.uid===' '?'': ''}</small></div></div>
 <div class="stat-grid" id="adminStats"><div class="stat"><b>—</b><span>${esc(t('pendingList'))}</span></div><div class="stat"><b>—</b><span>${esc(t('reports'))}</span></div><div class="stat"><b>—</b><span>${esc(t('users'))}</span></div></div>
 <div class="notice warn">${esc(t('functionsRequired'))}</div><button class="btn btn-outline btn-small" data-act="admin-refresh">${esc(t('refresh'))}</button>
 <h3>${esc(t('pendingList'))}</h3><div id="adminListings"></div><h3>${esc(t('reports'))}</h3><div id="adminReports"></div>
 ${tokenSuperAdmin()?`<h3>${esc(t('adminSetup'))}</h3><div class="notice">${esc(t('adminSetupDesc'))}</div><form id="moderatorForm">${field('UID','targetUid','Firebase Auth UID')}<label><input type="checkbox" name="enabled" checked> ${esc('منح صلاحية مشرف')}</label><button class="btn btn-outline" type="submit">${esc(t('save'))}</button></form>`:''}
 <button class="btn btn-outline" data-act="admin-logout">${esc(t('logout'))}</button></div>`;
}
function tokenSuperAdmin(){return !!adminUser?.__superAdmin}
async function loadAdminData(){
 if(!adminUser||!cachedFns)return;
 const {authM,storeM}=cachedFns,token=await authM.getIdTokenResult(adminUser,true);adminUser.__superAdmin=token.claims.superAdmin===true;
 if(token.claims.admin!==true&&!adminUser.__superAdmin)throw new Error(t('adminDenied'));
 const ql=await storeM.getDocs(storeM.query(storeM.collection(adminDb,'listings'),storeM.limit(100)));
 const qp=await storeM.getDocs(storeM.query(storeM.collection(adminDb,'posts'),storeM.limit(100)));
 const qr=await storeM.getDocs(storeM.query(storeM.collection(adminDb,'reports'),storeM.limit(100)));
 const qu=adminUser.__superAdmin?await storeM.getDocs(storeM.query(storeM.collection(adminDb,'users'),storeM.limit(100))):null;
 const all=[...ql.docs.map(d=>({id:d.id,...d.data(),kind:'listings'})),...qp.docs.map(d=>({id:d.id,...d.data(),kind:'posts'}))];
 const pending=all.filter(x=>x.status==='pending');
 $('#adminStats').innerHTML=`<div class="stat"><b>${pending.length}</b><span>${esc(t('pendingList'))}</span></div><div class="stat"><b>${qr.size}</b><span>${esc(t('reports'))}</span></div><div class="stat"><b>${qu?qu.size:'—'}</b><span>${esc(t('users'))}</span></div>`;
 $('#adminListings').innerHTML=pending.length?pending.map(x=>`<div class="item-row"><span><strong>${esc(x.title||x.description?.slice(0,70)||'')}</strong><small>${esc(x.kind)} · ${esc(x.ownerId||'')} · ${esc(timeText(x.createdAt))}</small></span><span><button class="btn btn-primary btn-small" data-act="moderate" data-id="${esc(x.id)}" data-kind="${esc(x.kind)}" data-status="approved">${esc(t('approve'))}</button><button class="btn btn-danger btn-small" data-act="moderate" data-id="${esc(x.id)}" data-kind="${esc(x.kind)}" data-status="rejected">${esc(t('reject'))}</button></span></div>`).join(''):emptyBox(t('nothing'),t('nothingDesc'));
 $('#adminReports').innerHTML=qr.size?qr.docs.map(d=>{const x=d.data();return `<div class="item-row"><span><strong>${esc(x.reason||'')}</strong><small>${esc(x.targetType||'')} · ${esc(x.targetId||'')} · ${esc(x.status||'')}</small></span></div>`}).join(''):emptyBox(t('nothing'),t('nothingDesc'));
}
async function adminLoginPhone(phone){
 if(!config)throw new Error(t('disconnected'));
 if(!adminAuth){
  const {appM,authM,storeM,functionsM}=cachedFns;
  const adminApp=appM.initializeApp(config,'najran-admin-portal');
  adminAuth=authM.getAuth(adminApp);adminDb=storeM.getFirestore(adminApp);adminFunctions=functionsM.getFunctions(adminApp,'us-central1');
 }
 await sendOtp(phone,true);
}
function showAdmin(){
 if(!config||!cachedFns){showSettings();return}
 openModal(`${modalHeader(t('adminTitle'),t('adminDesc'))}<div id="adminArea">
 <div class="notice warn">${esc(t('adminSetupDesc'))}</div><div id="adminNotice"></div>
 <form id="adminPhoneForm"><div class="field"><label for="adminPhone">${esc(t('phone'))}</label><input id="adminPhone" type="tel" inputmode="tel" placeholder="+9665xxxxxxxx" required></div><div id="admin-recaptcha"></div><button class="btn btn-primary" type="submit">${esc(t('sendOtp'))}</button></form>
 <form id="adminOtpForm" class="hidden"><div class="field"><label for="adminOtp">${esc(t('adminOtp'))}</label><input id="adminOtp" inputmode="numeric" autocomplete="one-time-code" required></div><button class="btn btn-primary" type="submit">${esc(t('adminLogin'))}</button></form>
 </div>`,true);
}
function showLegal(which){
 openModal(`${modalHeader(t(which))}<div class="legal">${esc(t(which==='privacy'?'privacyText':'termsText'))}</div>`);
}
async function enableNotifications(){
 if(!user||!db){showToast(t('loginNeeded'));return}
 if(!('serviceWorker'in navigator)||!('Notification'in window)){showToast(t('notificationsInfo'));return}
 try{
  const permission=await Notification.requestPermission();if(permission!=='granted'){showToast(isAr()?'لم تمنح إذن الإشعارات.':'Notification permission was not granted.');return}
  const vapid=prompt(t('vapid'));if(!vapid){showToast(t('notificationsInfo'));return}
  const messaging=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-messaging.js');
  if(!await messaging.isSupported()){showToast(t('notificationsInfo'));return}
  const reg=await navigator.serviceWorker.register('/firebase-messaging-sw.js');
  const msg=messaging.getMessaging(fb);
  const token=await messaging.getToken(msg,{vapidKey:vapid,serviceWorkerRegistration:reg});
  if(!token)throw new Error('FCM token unavailable');
  const {storeM}=cachedFns;await storeM.setDoc(storeM.doc(db,'users',user.uid,'devices',encodeURIComponent(token)),{token,updatedAt:storeM.serverTimestamp()});
  showToast(isAr()?'تم تسجيل الجهاز للإشعارات.':'Device registered for notifications.');
 }catch(e){console.error(e);showToast(`${t('error')}: ${e.message||''}`)}
}
async function copyText(text){try{await navigator.clipboard.writeText(text);showToast(t('copied'))}catch{if(window.AndroidAPI?.copyToClipboard){AndroidAPI.copyToClipboard(text);showToast(t('copied'))}else showToast(isAr()?'تعذر النسخ. حدّد النص وانسخه يدوياً.':'Copy failed. Select and copy the text manually.')}}
async function callAdmin(name,data){
 if(!adminFunctions||!fnModule)throw new Error(t('functionsRequired'));
 const call=fnModule.httpsCallable(adminFunctions,name);
 return await call(data);
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const act=b.dataset.act;
 try{
  if(act==='backdrop'&&e.target===b){closeModal();return}
  if(act==='close'){closeModal();return}
  if(act==='theme'){theme=theme==='dark'?'light':'dark';localStorage.setItem('najran_theme',theme);applyTheme();return}
  if(act==='language'){lang=lang==='ar'?'en':'ar';localStorage.setItem('najran_lang',lang);render();return}
  if(act==='nav'){changeTab(b.dataset.tab);return}
  if(act==='category'){activeCategory=b.dataset.category;query='';changeTab('explore');return}
  if(act==='account'){if(user){changeTab('profile')}else await showAuthModal();return}
  if(act==='settings'){showSettings();return}
  if(act==='privacy'||act==='terms'){showLegal(act);return}
  if(act==='create'){showCreateForm(false);return}
  if(act==='create-post'){showCreateForm(true);return}
  if(act==='detail'){showDetail(b.dataset.id);return}
  if(act==='favorite'){await toggleFavorite(b.dataset.id);if(currentDetail?.id===b.dataset.id)showDetail(b.dataset.id);return}
  if(act==='chat'){await startChatFor(b.dataset.id);return}
  if(act==='open-chat'){
   const c=chatRows.find(x=>x.id===b.dataset.chat);const other=(c?.members||[]).find(m=>m!==user?.uid);
   currentChat={id:b.dataset.chat,otherId:other,name:c?.memberNames?.[other]||other?.slice(0,10)||''};showChatModal();return
  }
  if(act==='report'){showReport(b.dataset.id,b.dataset.type);return}
  if(act==='review'){showReview(b.dataset.id);return}
  if(act==='edit-profile'){showProfileModal(false);return}
  if(act==='logout'){if(auth)await cachedFns.authM.signOut(auth);changeTab('home');showToast(t('logout'));return}
  if(act==='otp-back'){$('#otpForm')?.classList.add('hidden');$('#phoneForm')?.classList.remove('hidden');confirmation=null;if(verifier){try{verifier.clear()}catch{}verifier=null}return}
  if(act==='admin'){showAdmin();return}
  if(act==='admin-refresh'){await loadAdminData();return}
  if(act==='admin-logout'){if(adminAuth)await cachedFns.authM.signOut(adminAuth);adminUser=null;showAdmin();return}
  if(act==='moderate'){
   b.disabled=true;await callAdmin('adminModerate',{collection:b.dataset.kind,id:b.dataset.id,status:b.dataset.status});showToast(t('save'));await loadAdminData();return
  }
  if(act==='copy-rules'){await copyText(FIRESTORE_RULES);return}
  if(act==='copy-functions'){await copyText(FUNCTIONS_SAMPLE);return}
  if(act==='notifications'){await enableNotifications();return}
 }catch(err){console.error(err);showToast(`${t('error')}: ${err?.message||err}`)}
});
document.addEventListener('submit',async e=>{
 const f=e.target;if(!(f instanceof HTMLFormElement))return;
 e.preventDefault();
 try{
  if(f.id==='configForm'){await configureFirebase($('#firebaseJson').value);return}
  if(f.id==='phoneForm'){await sendOtp($('#phone').value.trim());return}
  if(f.id==='otpForm'){await verifyOtp($('#otp').value.trim());return}
  if(f.id==='profileForm'){await saveProfile(f);return}
  if(f.id==='listingForm'){const btn=f.querySelector('[type=submit]');btn.disabled=true;await submitListing(f);return}
  if(f.id==='reportForm'){await saveReport(f);return}
  if(f.id==='reviewForm'){await saveReview(f);return}
  if(f.id==='chatForm'){await sendMessage(f);return}
  if(f.id==='adminPhoneForm'){await adminLoginPhone($('#adminPhone').value.trim());return}
  if(f.id==='adminOtpForm'){const {authM}=cachedFns;const result=await confirmation.confirm($('#adminOtp').value.trim());confirmation=null;await inspectAdmin(result.user);return}
  if(f.id==='moderatorForm'){
   const fd=new FormData(f),uid=String(fd.get('targetUid')||'').trim(),enabled=f.querySelector('[name="enabled"]').checked;
   if(!uid)throw new Error('UID مطلوب');
   await callAdmin('adminSetModerator',{uid,enabled});showToast(t('save'));await loadAdminData();return
  }
 }catch(err){console.error(err);showToast(`${t('error')}: ${err?.message||err}`)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='photo'&&e.target.files?.[0]){
  const file=e.target.files[0];
  if(file.size>5*1024*1024){e.target.value='';showToast('حجم الصورة أكبر من 5 ميغابايت.');return}
  if(!file.type.startsWith('image/')){e.target.value='';showToast('الملف ليس صورة.');return}
  const url=URL.createObjectURL(file);const prev=$('#photoPreview');if(prev){prev.innerHTML=`<img class="image-preview" src="${url}" alt="معاينة الصورة">`;prev.querySelector('img').onload=()=>URL.revokeObjectURL(url)}
 }
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').firstElementChild)closeModal()});
applyTheme();
const savedConfig=localStorage.getItem('najran_firebase_config');
if(savedConfig){try{config=JSON.parse(savedConfig);loadModules(config).catch(e=>{console.error(e);fb=null;render();showToast(`${t('error')}: ${e.message||''}`)})}catch(e){console.warn('Saved Firebase config invalid',e)}}
render();
</script>
